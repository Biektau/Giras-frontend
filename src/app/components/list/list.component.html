<div class="list-container">
  @if (isLoading()) {
  <div class="loading">Загрузка...</div>
  } @else if (items().length === 0) {
  <div class="empty">Ничего не найдено</div>
  } @else {
  <div class="list">
    @for (item of items(); track item.id) {
    <div class="list-item" (click)="onSelect(item)">
      <div class="item-main">
        <div class="drag-handle">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <span class="item-name">{{ item.name }}</span>

        <div class="item-actions">
          <button class="action-btn copy-btn" type="button">
            <lucide-icon [img]="Copy" [size]="14" />
          </button>
          <button class="action-btn delete-btn" type="button" (click)="onDelete(item.id)">
            <lucide-icon [img]="Trash2" [size]="14" />
          </button>
        </div>
      </div>

      <div class="item-sub">
        <div class="color-dot"></div>
        <span class="item-color">{{ item.color }}</span>
      </div>
    </div>
    }
  </div>
  }
</div>
